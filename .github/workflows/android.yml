# ============================================================
#  Compile l'APK Android à chaque modification de l'app, et le
#  publie dans la release « android » du dépôt :
#  https://github.com/soaresden/PlongeeJournal/releases/latest/download/PlongeeJournal.apk
#
#  Signature : si les secrets ANDROID_KEYSTORE_B64 et
#  ANDROID_KEYSTORE_PASS existent, l'APK est signé avec TA clé —
#  chaque nouvelle version s'installe par-dessus l'ancienne sans
#  rien perdre. Sans eux, une clé de debug est utilisée.
# ============================================================
name: APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'css/**'
      - 'js/**'
      - 'assets/**'
      - 'vendor/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'outils/android-icones.py'
      - 'outils/build-www.mjs'
      - '.github/workflows/android.yml'

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # MN90 (dépôt public) : embarqué dans l'APK pour l'onglet MN90 hors ligne.
      - uses: actions/checkout@v4
        with:
          repository: soaresden/MN90Mobile
          path: mn90src

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Tests
        run: npm test

      - name: Projet Android (Capacitor)
        run: |
          npm install --no-audit --no-fund
          MN90_REQUIS=1 npm run www
          test -f www/mn90/planner/index.html || { echo "::error::MN90 absent de www/mn90"; exit 1; }
          # Numéro de version embarqué, pour le bouton « Mise à jour ».
          cat www/version.json
          grep -q '"build": ${{ github.run_number }},' www/version.json || { echo "::error::www/version.json sans numéro de build"; exit 1; }
          npx cap add android
          npx cap sync android
          # Import Bluetooth depuis la montre : le module natif doit être là.
          grep -q "capacitor-community-bluetooth-le" android/capacitor.settings.gradle \
            || { echo "::error::Module Bluetooth (@capacitor-community/bluetooth-le) absent du projet Android"; exit 1; }
          # Mise à jour depuis l'appli : téléchargement, puis installateur d'Android.
          for MODULE in capacitor-filesystem capacitor-community-file-opener; do
            grep -q "$MODULE" android/capacitor.settings.gradle \
              || { echo "::error::Module $MODULE absent du projet Android (mise à jour dans l'appli)"; exit 1; }
          done

      - name: Icônes, permissions, version
        run: |
          pip install --quiet pillow
          python outils/android-icones.py android/app/src/main/res
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />#' "$MANIFEST"
          # Bluetooth (montre Suunto) : SCAN/CONNECT depuis Android 12, l'ancien
          # couple BLUETOOTH/ADMIN + la position jusqu'à Android 11. Mêmes
          # attributs que le manifeste du module, pour une fusion sans conflit.
          sed -i 's#<uses-permission android:name="android.permission.CAMERA" />#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n    <uses-feature android:name="android.hardware.bluetooth_le" android:required="false" />#' "$MANIFEST"
          grep -q "BLUETOOTH_CONNECT" "$MANIFEST" || { echo "::error::Permissions Bluetooth non ajoutées"; exit 1; }
          # Mise à jour depuis l'appli : sans cette permission, Android refuse
          # d'ouvrir l'installateur pour un APK téléchargé par l'appli.
          sed -i 's#<uses-permission android:name="android.permission.CAMERA" />#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />#' "$MANIFEST"
          grep -q "REQUEST_INSTALL_PACKAGES" "$MANIFEST" || { echo "::error::Permission d'installation non ajoutée"; exit 1; }
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"2.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "permission\|uses-feature" "$MANIFEST"
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Compilation
        working-directory: android
        run: |
          chmod +x gradlew
          if [ -n "${{ secrets.ANDROID_KEYSTORE_B64 }}" ]; then
            ./gradlew --no-daemon assembleRelease
          else
            ./gradlew --no-daemon assembleDebug
          fi
          # Le manifeste final (fusionné) doit demander le Bluetooth.
          FUSION=$(find app/build/intermediates -path '*merged_manifest*' -name AndroidManifest.xml | head -1)
          echo "Manifeste fusionné : $FUSION"
          grep -o 'android.permission.BLUETOOTH[A-Z_]*' "$FUSION" | sort -u
          grep -q 'BLUETOOTH_SCAN' "$FUSION" && grep -q 'BLUETOOTH_CONNECT' "$FUSION" \
            || { echo "::error::Permissions Bluetooth absentes de l'APK"; exit 1; }
          # …et pouvoir installer ses mises à jour (permission + FileProvider du module).
          grep -q 'REQUEST_INSTALL_PACKAGES' "$FUSION" && grep -q 'file.opener.provider' "$FUSION" \
            || { echo "::error::Mise à jour dans l'appli impossible : permission ou FileProvider absents de l'APK"; exit 1; }

      - name: Signature
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.jks
            "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligne.apk
            "$BT/apksigner" sign --ks release.jks --ks-key-alias carnet \
              --ks-pass env:KS_PASS --key-pass env:KS_PASS --out PlongeeJournal.apk aligne.apk
            rm -f release.jks
          else
            echo "::warning::Pas de clé de signature : APK de debug (à désinstaller avant chaque mise à jour)."
            cp android/app/build/outputs/apk/debug/app-debug.apk PlongeeJournal.apk
          fi
          "$BT/apksigner" verify --print-certs PlongeeJournal.apk | head -3
          ls -la PlongeeJournal.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PlongeeJournal-apk
          path: PlongeeJournal.apk

      - name: Publication (release « android »)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITRE="Carnet de plongée — APK 2.0.${{ github.run_number }}"
          NOTES="APK Android compilé depuis ${GITHUB_SHA::7}. Sur le téléphone ou la tablette : télécharger, ouvrir, autoriser l’installation depuis cette source."
          # GitHub répond parfois 500 en passant : on réessaie, jusqu'à ce
          # que la release porte bien le nouveau numéro.
          for essai in 1 2 3 4 5; do
            echo "Publication, essai $essai"
            if gh release view android >/dev/null 2>&1; then
              gh release delete android --yes --cleanup-tag || true
            fi
            git push --delete origin refs/tags/android 2>/dev/null || true
            if gh release create android PlongeeJournal.apk --title "$TITRE" --notes "$NOTES" --latest; then
              if [ "$(gh release view android --json name --jq .name)" = "$TITRE" ]; then
                echo "Publiée : $TITRE"
                exit 0
              fi
            fi
            sleep $((essai * 15))
          done
          echo "::error::Publication impossible après 5 essais"
          exit 1
